<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi Time Tracker Setup</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Setup Screen -->
  <div id="setup-screen" class="setup-container">
    <h2 class="setup-title">Multi Time Tracker Setup</h2>
    
    <div class="form-group">
      <label class="form-label" for="event-title">Veranstaltungstitel</label>
      <input type="text" id="event-title" class="form-input" placeholder="z.B. Hofgespräch im Landgasthaus">
    </div>

    <div class="form-group">
      <label class="form-label" for="speaker-count">Anzahl der Sprecher:innen</label>
      <select id="speaker-count" class="form-select">
        <option value="1">1 Sprecher:in</option>
        <option value="2">2 Sprecher:innen</option>
        <option value="3">3 Sprecher:innen</option>
        <option value="4">4 Sprecher:innen</option>
        <option value="5">5 Sprecher:innen</option>
        <option value="6">6 Sprecher:innen</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label" for="default-time">Redezeit pro Sprecher (Minuten)</label>
      <input type="number" id="default-time" class="form-input" value="15" min="1" max="120">
    </div>

    <div id="speaker-names-container" class="speaker-names">
      <!-- Dynamisch generierte Eingabefelder -->
    </div>

    <!-- Info-Block im Setup (ohne Logo beim ersten Start) -->
    <div class="form-group">
      <div class="info-header">
        <h3 class="info-title">Veranstaltungsinformationen</h3>
        <div class="info-controls">
          <button class="btn-info-toggle" onclick="toggleInfoBlock()" title="Anzeigen/Ausblenden">👁️</button>
        </div>
      </div>
      
      <!-- Logo-Auswahl und -Entfernung AUSSERHALB des editierbaren Bereichs -->
      <div class="logo-upload-section">
        <label for="logo-upload" class="logo-upload-label">
          📂 Logo auswählen
          <input type="file" id="logo-upload" accept="image/png,image/jpeg" style="display: none;" onchange="handleLogoUpload(this)">
        </label>
        <div id="logo-preview-container" class="logo-preview-container">
          <!-- Kein Standardlogo beim ersten Start -->
          <img id="setup-info-logo" src="" alt="Domäne Dahlem Info Logo" class="info-logo hidden">
        </div>
        <button class="btn-logo-remove" onclick="removeLogo()" title="Logo entfernen" id="setup-logo-remove-btn" style="display: none;">🗑️ Logo entfernen</button>
      </div>
      
      <!-- Einfaches Textfeld mit reinem Text (kein HTML) -->
      <textarea id="setup-info-text" class="info-text-area" rows="3" placeholder="Zusätzliche Veranstaltungsinformationen">3. Hofgespräch 2026
19.09.2026 - Dahlem</textarea>
    </div>

    <button class="btn btn-primary" onclick="generateTimers()">Timer Generieren</button>
  </div>

  <!-- Timer Screen -->
  <div id="timer-screen" class="timer-container">
    <div class="header">
      <div class="header-logo-left">
        <img id="header-logo-left" src="assets/logo_header_left.png" alt="Linkes Header-Logo" class="header-logo">
      </div>
      
      <div class="header-content">
        <h1 id="header-title">Veranstaltungstitel</h1>
        <div class="subtitle">Multi Time Tracker</div>
      </div>
      
      <div class="header-logo-right">
        <img id="header-logo-right" src="assets/logo_header_right.png" alt="Rechtes Header-Logo" class="header-logo">
      </div>
    </div>

    <div id="timer-grid" class="timer-grid">
      <!-- Dynamisch generierte Timer-Blöcke -->
    </div>

    <!-- ✅ Timer-Info-Block mit ID info-content -->
    <div id="info-block" class="block info-block">
      <div class="info-content">
        <div class="logo-preview-container">
          <img id="info-logo" src="" alt="Domäne Dahlem Info Logo" class="info-logo hidden">
        </div>
        <div id="info-text-display" class="info-text">
          <!-- Wird per JS gefüllt -->
        </div>
      </div>
    </div>

    <button class="back-btn" onclick="goBackToSetup()">← Zurück zum Setup</button>
  </div>

  <script src="js/setup.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
