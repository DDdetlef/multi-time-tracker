<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Time Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="setup-screen" class="setup-container">
    <h1 class="setup-title">Multi Time Tracker Setup</h1>

    <div class="form-group">
      <label class="form-label" for="event-title">Veranstaltungstitel</label>
      <input type="text" id="event-title" class="form-input" placeholder="z. B. Hofgespräch im Landgasthaus">
    </div>

    <div class="form-group">
      <label class="form-label" for="speaker-count">Anzahl der Sprecher:innen</label>
      <select id="speaker-count" class="form-select">
        <option value="1">1 Sprecher:in</option>
        <option value="2">2 Sprecher:innen</option>
        <option value="3">3 Sprecher:innen</option>
        <option value="4">4 Sprecher:innen</option>
        <option value="5">5 Sprecher:innen</option>
        <option value="6">6 Sprecher:innen</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label" for="default-time">Redezeit pro Sprecher:in (Minuten)</label>
      <input type="number" id="default-time" class="form-input" value="15" min="1" max="120" step="1">
    </div>

    <fieldset class="form-group mode-fieldset">
      <legend class="form-label">Betriebsart</legend>
      <div class="mode-options">
        <label class="mode-option">
          <input type="radio" name="timer-mode" value="live" checked>
          <span>
            <strong>Live</strong>
            <small>Nur Start und Stop</small>
          </span>
        </label>
        <label class="mode-option">
          <input type="radio" name="timer-mode" value="test">
          <span>
            <strong>Test</strong>
            <small>Mit Reset, +1 Min und -1 Min</small>
          </span>
        </label>
      </div>
    </fieldset>

    <div id="speaker-names-container" class="speaker-names"></div>

    <section class="form-group info-setup" aria-labelledby="info-title">
      <div class="info-header">
        <h2 id="info-title" class="info-title">Veranstaltungsinformationen</h2>
        <button id="info-toggle" class="btn-info-toggle" type="button" aria-expanded="true">
          Ausblenden
        </button>
      </div>

      <div id="setup-info-body">
        <div class="logo-upload-section">
          <label for="logo-upload" class="logo-upload-label">Logo auswählen</label>
          <input class="visually-hidden" type="file" id="logo-upload" accept="image/png,image/jpeg">

          <div id="logo-preview-container" class="logo-preview-container">
            <img id="setup-info-logo" src="assets/logo_infoblock.png" alt="Veranstaltungslogo" class="info-logo">
          </div>

          <button id="setup-logo-remove-btn" class="btn-logo-remove" type="button">
            Logo entfernen
          </button>
        </div>

        <label class="form-label" for="setup-info-text">Info-Text</label>
        <textarea id="setup-info-text" class="info-text-area" rows="3" placeholder="Zusätzliche Veranstaltungsinformationen">3. Hofgespräch 2026
19.09.2026 - Dahlem</textarea>
      </div>
    </section>

    <button id="generate-timers" class="btn btn-primary" type="button">Timer generieren</button>
  </main>

  <main id="timer-screen" class="timer-container" hidden>
    <header class="header">
      <div class="header-logo-left">
        <img src="assets/logo_header_left.png" alt="" class="header-logo">
      </div>
      <div class="header-content">
        <h1 id="header-title">Veranstaltungstitel</h1>
        <div class="subtitle">Multi Time Tracker</div>
      </div>
      <div class="header-logo-right">
        <img src="assets/logo_header_right.png" alt="" class="header-logo">
      </div>
    </header>

    <div id="timer-grid" class="timer-grid"></div>
  <p id="timer-status" class="visually-hidden" aria-live="polite"></p>

    <section id="info-block" class="info-block" aria-label="Veranstaltungsinformationen">
      <div class="info-content">
        <div id="timer-logo-container" class="logo-preview-container">
          <img id="info-logo" src="assets/logo_infoblock.png" alt="Veranstaltungslogo" class="info-logo">
        </div>
        <div id="info-text-display" class="info-text"></div>
      </div>
    </section>

    <div class="stop-all-container">
      <button id="stop-all-timers" class="stop-all-btn" type="button" disabled>Alle stoppen</button>
      <button id="reset-all-timers" class="stop-all-btn" type="button">Alle zurücksetzen</button>
    </div>

    <button id="back-to-setup" class="back-btn" type="button">← Zurück zum Setup</button>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/setup.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
