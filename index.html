<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi Time Tracker Setup</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Setup Screen -->
  <div id="setup-screen" class="setup-container">
    <h2 class="setup-title">Multi Time Tracker Setup</h2>
    
    <div class="form-group">
      <label class="form-label" for="event-title">Veranstaltungstitel</label>
      <input type="text" id="event-title" class="form-input" placeholder="z.B. Hofgespräch im Landgasthaus">
    </div>

    <div class="form-group">
      <label class="form-label" for="speaker-count">Anzahl der Sprecher:innen</label>
      <select id="speaker-count" class="form-select">
        <option value="1">1 Sprecher:in</option>
        <option value="2">2 Sprecher:innen</option>
        <option value="3">3 Sprecher:innen</option>
        <option value="4">4 Sprecher:innen</option>
        <option value="5">5 Sprecher:innen</option>
        <option value="6">6 Sprecher:innen</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Zeitkonfiguration</label>
      <div class="time-options">
        <div class="time-option selected" onclick="selectTimeOption('all')">
          Alle gleich
        </div>
        <div class="time-option" onclick="selectTimeOption('individual')">
          Individuell
        </div>
      </div>
    </div>

    <div id="speaker-names-container" class="speaker-names">
      <!-- Dynamisch generierte Eingabefelder -->
    </div>

    <div class="form-group">
      <label class="form-label" id="time-label" for="default-time">Standardzeit pro Sprecher (Minuten)</label>
      <input type="number" id="default-time" class="form-input" value="15" min="1" max="120">
    </div>

    <button class="btn btn-primary" onclick="generateTimers()">Timer Generieren</button>
  </div>

  <!-- Timer Screen -->
  <div id="timer-screen" class="timer-container">
    <div class="header">
      <div class="header-logo-left">
        <img id="header-logo-left" src="assets/logo_header_left.png" alt="Linkes Header-Logo" class="header-logo">
      </div>
      
      <div class="header-content">
        <h1 id="header-title">Veranstaltungstitel</h1>
        <div class="subtitle">Multi Time Tracker</div>
      </div>
      
      <div class="header-logo-right">
        <img id="header-logo-right" src="assets/logo_header_right.png" alt="Rechtes Header-Logo" class="header-logo">
      </div>
    </div>

    <div id="timer-grid" class="timer-grid">
      <!-- Dynamisch generierte Timer-Blöcke -->
    </div>

    <div class="block info-block">
      <img id="info-logo" src="assets/logo_infoblock.png" alt="Domäne Dahlem Info Logo" class="info-logo">
      <div class="info-text">
        <strong>Hofgespräch im Landgasthaus</strong><br>
        09.09.2026
      </div>
    </div>

    <button class="back-btn" onclick="goBackToSetup()">← Setup zurücksetzen</button>
  </div>

  <script src="js/setup.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
